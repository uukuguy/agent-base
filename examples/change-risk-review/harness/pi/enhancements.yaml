apiVersion: agent-base/v1

# ============================================================================
# 业务级增强（harness 层）—— 这个示例的主角
#
# ## 它和中性定义的分工
#
#   中性定义（agent.yaml）说「用什么、边界在哪」——两个运行时都要能跑；
#   harness 层说「这个运行时上，业务能力具体怎么实现」——**允许各运行时不同**。
#
# 本示例的中性定义只承诺"用风险评分工具"，而这个工具**在本运行时上**由下面这个扩展提供。
# 于是同一份中性定义，换个运行时可以换一种实现（甚至暂时没有），基座不会假装它等价。
#
# ## 闸门怎么盯它
#
#   · 闸门 1：清单合法 + 不许重复表达中性定义字段（单一真源）
#   · 闸门 2：**硬断言**「实际加载的扩展集合 == 声明集合」——
#     声明了却没加载、或偷偷加载了没声明的，都当场失败
#   · 闸门 3：端点侧看到的工具数会**变多**（业务工具真的发给了模型）
# ============================================================================

harness: pi
enhancements:
  - kind: tool
    id: corp-risk-score
    entry: extensions/risk-score.ts
    description: >
      企业风险评分工具（确定性规则、可复算、可审计）。
      放在 harness 层而不是中性定义里：中性定义只承诺"用评分工具"，
      具体实现是本运行时的事 —— 换运行时可以用别的实现。
