apiVersion: agent-base/v1

# ============================================================================
# 业务级增强（harness 层）—— **另一个接入方式，同一份业务代码**
#
# 与 pi 那份声明对照着看，差别只有"怎么接"：
#   · pi ：TypeScript 扩展，`pi.registerTool()`，参数用 JSON Schema
#   · dsh：cordis 插件（`apply(ctx)` + `ctx.tools.register()`），参数用它自己的 DSL
# 而两边 import 的业务代码是**同一份**：`harness/shared/risk-score.mjs`
# （渲染器把它拷到产物 `<产物>/harness/business/`，两个接入件都用 `../business/…` 引用）。
#
# `package` 用**相对路径**：本运行时的加载器对以 `.` 开头的名字按相对路径 import，
# 基准是 **profile 配置所在目录**（`<产物>/dsh-home/profiles/<智能体名>/`），
# 所以三层 `..` 才回到产物根，再进 `harness/dsh/` 拿插件文件。
# ============================================================================

harness: dsh
enhancements:
  - kind: tool
    id: corp-risk-score
    package: ../../../harness/dsh/risk-score.js
    description: >
      企业风险评分工具（确定性规则、可复算、可审计）—— 与 pi 侧同一份业务代码，
      只有接入方式不同（这里是 cordis 插件 + 工具注册 seam）。
