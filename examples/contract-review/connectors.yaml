apiVersion: agent-base/v1

# 这个示例**故意带一个连接器**（另一个示例 idea-to-proof 是纯技能型）。
#
# 为什么用 filesystem：
#   · 零凭据 —— 任何人 clone 下来就能跑，不需要先去申请密钥（验证期的关键）
#   · 可离线 —— 服务器包已随机基座镜像预装，"构建期装齐、运行期断网"成立
#   · 两个运行时都支持 —— 于是它同时是"跨运行时等价性"的载体
#
# 可访问范围由**挂载卷**决定，不由参数层决定：容器里把合同目录挂进 /workspace，
# 智能体就只能看到那个目录。
mcpServers:
  - ref: filesystem
    enabled: true
