apiVersion: agent-base/v1

# 本示例**故意不带连接器**（另一个示例 contract-review 带 filesystem，用来演示跨运行时等价性）。
#
# 为什么：隐私审查的输入面越小越好。这个智能体审查的是「数据责任人主动交进来的材料」，
# 不是自己去生产系统里捞数据 —— 一旦它能主动读库/读盘，"审查者"就变成了"又一个数据访问方"，
# 反而扩大了敏感信息的暴露面。所以要读文件时，由**调用方**把材料贴进会话或按需挂载。
#
# 需要连系统时在这里加（按名引用基座预装条目即可）：
#   mcpServers:
#     - ref: filesystem
#       enabled: true
mcpServers: []
