apiVersion: agent-base/v1

# 业务给"机械轨迹"起的说法。基座**不解释**这些词，只按定位符机械查找后原样呈现。
# 换一个业务、换一套词，基座与查看器一行都不用改。
#
# 定位符语法（基座定义）：agent | model:<route> | skill:<name> | connector:<name>
#                        | tool:<原始工具名> | log:<日志命名空间> | gate:<闸门名>
labels:
  "agent":                          本地模型开发验证助手
  "model:ollama":                   本机 Ollama（OpenAI 兼容面）
  "skill:endpoint-swap-checklist":  换模型 / 换端点前后的核对清单
  "skill:prompt-eval-offline":      用固定用例离线评测提示词与输出
  "skill:capability-boundary-log":  记录本地模型的能力边界
  "tool:read":                      读取端点记录 / 评测用例 / 日志
  "tool:bash":                      只读探测命令（列模型、问 /v1/models、跑评测脚本）
  "gate:probes":                    连通性检查
  "gate:smoke":                     端到端冒烟（真跑一次）
  "gate:doctor":                    运行时自证：实际加载了哪些技能
  "log:eval":                       离线评测过程记录
