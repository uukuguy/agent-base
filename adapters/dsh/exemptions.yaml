# dsh 适配器的等价性豁免（统一设计 §1.4 / §6.6）
#
# 与另一个 harness 的不对称要**显式**写在这里，不允许"沉默的差异"。
- id: mcp-client-native
  scope: connectors
  reason: >
    本 harness **原生支持** MCP（dsh-mcp-client），另一个 harness 是 unsupported（需基座补客户端扩展）。
    因此带连接器的智能体在两边的等价性**不成立**；比对时必须在报告里标为"未比对"，
    不得因为一边有、一边没有就静默当作通过。
  reviewBy: 2027-06-30

- id: approval-trace-available
  scope: trajectory.tool.call.decision
  reason: >
    本 harness 有原生审批接缝（`ctx.approval.request` → allowed-once | rejected | cancelled | unavailable，
    无应答者 ⇒ fail-closed）与审批**会话事件**类型（approval/asked、approval/decided）；
    另一个 harness 没有**逐次调用**的审批字段（缺口 G3），那边只能记 `unobserved`（不写 allow）。
    ⚠️ 实测更正（曾写成"可回答谁放行了这次调用"，那是**过度声明**）：审批审计事件**不在**统一轨迹
    映射所读的 `--json` 事件流里，会话文件在实测运行里也只有 `session` 引导事件 ⇒
    **目前两侧都无法从轨迹回答"谁放行了这次工具调用"**，跨 harness 比对时不得当作等价。
    已收窄的那一半：基座现在提供第一类 `approval.decision` 事件，**走审批门的动作**（如容器验证）
    在主运行时侧可回答；本侧要落地同样的能力须先建基座不变量插件脚手架（路线图 §30 A6b）。
    证据：`make dsh-approval-probe`。
  reviewBy: 2027-06-30

- id: tool-naming
  scope: tools.names
  reason: 工具名由 harness 决定，业务不依赖；比对工具名会把命名习惯差异误判成行为不等价。
  reviewBy: 2027-03-31

- id: prompt-text
  scope: persona.promptText
  reason: 人设最终拼装方式由 harness 决定（本 harness 走工作区指令文件发现机制，不是固定路径注入）。
  reviewBy: 2027-03-31

- id: tool-call-order
  scope: trajectory.toolOrder
  reason: 受模型采样影响，不是 harness 差异。
  reviewBy: 2027-03-31

- id: token-count-and-latency
  scope: model.usage, model.latency
  reason: 运行时特性，不是定义的可移植性承诺。
  reviewBy: 2027-03-31

- id: skills-observation-scope
  scope: trajectory.skills
  reason: >
    技能集合的口径两边不同（实测）：本 harness 没有"列出已发现技能"的零凭据原语，
    doctor 只能给「已在 customSkillDirs 配置且 SKILL.md 就位」；另一个 harness 能问出"实际加载了哪些"。
    因此跨 harness 比对技能集合时，本侧结论的强度较弱，必须在报告里标注。
  reviewBy: 2027-06-30

- id: tool-granularity
  scope: tools.deny
  reason: >
    工具粒度不同（实测）：中性的 read/write/edit 在本 harness 是**同一个** tool-fs row，
    禁用其一即禁用三者。因此"禁了 write 但保留 read"这种意图在本侧**做不到**，
    跨 harness 比对工具边界时必须按 row 粒度而非工具名粒度看。
  reviewBy: 2027-06-30

- id: reasoning-effort-not-mapped
  scope: model.reasoningEffort
  reason: >
    本适配器尚未把中性定义的 `model.reasoningEffort` 映射到产物：该 harness 的 provider 模型条目
    有 `reasoningEfforts` 字段，但它的取值形状（level → provider 值 的映射）**未实测**。
    按纪律不猜形状 —— 因此渲染器把它声明为**豁免并写明理由**（清单 expresses 里可见），
    而不是悄悄丢掉这个字段。补法：实测该字段的接受形状后补映射，并把本豁免删掉。
  reviewBy: 2027-03-31

- id: command-completions-unavailable
  scope: commands.completions
  reason: >
    另一个运行时的自省命令带**动态补全**（`getArgumentCompletions`）——"补全列表本身就是
    '一个项目应该有哪些信息'的目录"是那条命令设计的一半价值。
    本运行时的命令注册接口只给 `input.hint`（一句话提示），**没有动态补全回调** ⇒
    这里把分类清单写进 hint 作为**最接近的等价物**，但**不是等价**：
    补全随输入逐步收窄、以及在补全里看到"该项目里真实存在的值"这两点，本侧做不到。
    声明方式与其它豁免一致：可以不一样，但不许悄悄不一样。
  reviewBy: 2027-06-30

