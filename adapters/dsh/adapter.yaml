harness: dsh
version: "0.1.7-rc.1"      # 精确 pin（基线是 RC，接口可能变 —— 升级时只复核本文件与 render/doctor）
adapterVersion: "0.1.0"
bin: dsh                        # 可执行名（镜像内直接调用；harness 专有事实归本文件）
package: "@deepseek-ai/dsh"   # npm 安装坐标（镜像构建用；harness 专有事实归本文件）

renders:
  # 产物形态（实测确定）：$DSH_HOME/profiles/<name>/ 四件套 + workspace/AGENTS.md + 技能
  #   cordis.patch.yml（我们的 patch 数组）· package.json（bundles）· cordis.yml · pnpm-workspace.yaml
  # **bundles 用 base + dsh-headless**（不是 web）：实测 web 模板把
  #   agent-instructions / skill-filesystem / tool-skill / tool-fs 全部**禁用**（它由 Web UI 驱动），
  #   而 headless 全都启用。我们的用法是"跑一个任务看结果"。
  output: dsh-home/profiles/<name>   # 渲染产物形态（实际目录树：dsh-home/ + workspace/ + skills/）
  deterministic: true                # conformance C2 会验证「同输入同产物」
  workspace: workspace/AGENTS.md     # 人设落点（agent-instructions 是工作区指令文件的发现器）

# ============================================================================
# 能力声明（统一设计 §5.2）·取值只用 §5.2 的枚举：supported | partial | unsupported | extension
# 每条 note 标注依据：【实测】本机验证过；【文档】上游 README/文档；【待实测】尚未证实
# ============================================================================
# 支持的**模型协议形状**（provider 条目里 `api:` 的合法取值）。
# 【实测】从该运行时包内扫出的 api 令牌。provider 写了这里没有的值时，
# 闸门 1 会当场拦住（providers/model-api），而不是渲染出一份适配器不认的配置。
modelApis: [anthropic-messages, azure-openai-responses, bedrock-converse-stream, openai-completions, openai-responses]

# 可订阅的**生命周期事件集合**（L2 钩子的契约面，路线图 §23 E1）。
# dsh **没有统一钩子总线**：它的 L2 是 Cordis 服务 seam + waterfall 拦截
# （`agent/pre-step`、`tools/pre-execute`、`agent/turn-stopping` …），名字是插件树的实现细节，
# 还没有一份权威可数的清单（设计文档 §5.1 记的是"~30 个服务 seam"，不是确数）。
# 所以这里**如实标 enumerated: false**：闸门 1 不拿它校验名字，但会把 dsh 的钩子声明标成
# 「未验证」并列出来（D-0015 的"允许但不保证"）—— 不假装验过，也不因此拦着不让写。
hookEvents:
  enumerated: false
  count: 0
  source: "docs/design/2026-09-26-harness-customization.md §5.1（~30 个服务 seam + waterfall）"
  note: >
    要让名字也进判据，得先把 seam 名字穷举出来并给个复算命令（与 pi 侧同一件工作）。
    在那之前：dsh 的 kind=hook 声明一律按「未验证」处理，且这份声明本身也要能被人工复核。
  events: []

# 运行时自己的**凭据/配置目录**用哪个环境变量指（登录态在那里，如 pi 的 auth.json）。
# 基座用 `AGENT_HARNESS_HOME` 统一表达"把登录态目录给我"，由适配器映射成它自己的变量名。
credentialDirEnv: DSH_HOME

capabilities:
  nativeParamInterpolation: supported
  nativeParamInterpolationNote: >
    该 harness 的 patch 支持 `!!js` 表达式（实测 `--dump-config` 里就有
    `disabled: !!js '!ctx.get(...)'`），因此凭据/端点可用 `!!js process.env.X` 在运行期解析。
    但只允许读参数层清单里的名字（§11.3），否则等于绕开参数层纪律。

  runtimeWritableConfig: partial
  runtimeWritableConfigNote: >
    基座 home 层与 profile 由镜像提供；`--dump-config` 本身不写任何东西【实测】。
    但运行会话会写 `$DSH_HOME/sessions/`（实测目录存在且按项目分桶），故仍需可写卷承载会话与状态。

  implicitSkillSources: partial
  implicitSkillSourcesNote: >
    **六个 rank 根**（project-dsh / project-agents / custom / user-dsh / user-agents / bundled）【文档 §11.1】，
    关不掉。处置：文件系统隔离 + 渲染时把智能体技能**显式**写进 profile 的
    `customSkillDirs`（rank 300，实测确认该 config 键存在），再由 doctor 断言集合相等。

  configInclude: partial
  configIncludeNote: >
    四层合成（bundle → profile → home → `--patch`），但 patch 的 `config` 是**整体替换**而非深合并，
    且 bundle 之间不可嵌套【文档 §11.1】。处置：渲染器产出**完整** config，不做增量假设。

  hmr: supported
  hmrNote: tui 上启用，headless/SDK/ACP 显式禁用（§9.1）。本地迭代用 tui，容器内验契约。

  childAgents: supported
  childAgentsNote: >
    原生 subagent 体系【实测：组合树含 dsh-subagent / dsh-subagent-spawn-in-process /
    dsh-tool-subagent 等 row】，另有 agent-team 实验插件。

  osSandbox: partial
  osSandboxNote: >
    landlock 仅 Linux【文档 §11.1】；macOS 上无等价物。处置：安全断言只在容器内算数（§7.2）。

  permissionModel: supported
  permissionModelNote: >
    原生权限预设 + 审批；**无应答者时 fail closed**【文档 §11.1】。
    无人值守运行必须显式自动放行，否则卡死 —— 这条要进 failures.md。

  traceEmit: supported
  traceEmitNote: >
    原生会话轨迹：`$DSH_HOME/sessions/--<cwd>--/<id>/session.v4.jsonl`（**zstd 压缩的 JSONL**，
    版本 v4）【实测】。记录以 `{type, seq, time, data}` 为骨架，type 用 `/` 命名空间
    （`tool/call`、`tool/result`、`request/context`、`approval/policy`、`sandbox/mode` …）。
    比另一个 harness 更强的一处：**有原生的审批与沙箱事件**，可回答"谁放行了这次调用"。
    映射规格见 trace-mapping.md。

  mcpClient: supported
  mcpClientNote: >
    **原生支持**（实测包存在：`@deepseek-ai/dsh-mcp-client`）。每服务器一条 insert row：
      - insert:
          - id: mcp-<name>
            name: '@deepseek-ai/dsh-mcp-client'
            config: { serverName, transport: stdio|streamable-http, command/args 或 url/headers }
    serverName 有硬约束 [A-Za-z0-9_-]{1,32}（不合法时渲染**响亮失败**，不悄悄改名）。
    端点与凭据走参数下放：渲染成 `!!js process.env.<引用名>`，不写死真值 ——
    与该插件 README 的官方写法一致，所以这条不是权宜之计。
    `failOnStartupError` 默认 false（连不上也启动）【文档】—— 这是 D3：必须由探针在闸门 3 抓，
    不能指望它自己报错。

  runModes: [interactive, oneshot, rpc, debug]

# 业务级增强的**声明形态**（决定用例助手怎么写声明、渲染器怎么读）：
#   file    = 扩展是产物里的文件，用 `entry:` 指向（如 extensions/x.ts）
#   package = 扩展是 npm 包（如 cordis 插件），用 `package:` 指向
enhancementShape: package

failures: failures.md
failureCases: failure-cases.yaml
exemptions: exemptions.yaml

# ============================================================================
# 运行期契约（实测得出；S3 的 run-local / entrypoint 照此实现）
# ============================================================================
runtime:
  home:
    env: DSH_HOME
    value: <render 产物>/dsh-home
    why: profile 位于 `$DSH_HOME/profiles/<name>/`，模型路由**能力**在 home 层（§11.4）
  profile:
    flag: ["--profile", "<agent-name>"]
    why: 每个智能体一个 profile，构建期生成；交付镜像不接受 `--patch`（§11.3）
  selfReport:
    flag: ["--dump-config"]
    why: >
      **零凭据自证原语**【实测】：打印组合后的完整 profile 树后退出，不 mount、不连网。
      doctor 靠它回答"实际加载了什么"，而不是"我们渲染了什么"。
  permissiveNeeded:
    note: >
      无人应答者时审批 fail closed。自动化验证必须显式给出放行策略，
      否则进程会卡在审批上而看起来像"卡死"。
  forbidPatch:
    note: >
      `--patch` 仅限本地调试。交付/验证入口遇到它必须失败（退出码 2），
      否则"调试过的行为"会被误当交付行为（§11.3）。
