apiVersion: agent-base/v1

# ============================================================================
# 基座不变量增强的声明清单（§4.5）
#
# 为什么基座自己的扩展也要声明：闸门 2 的第三条硬断言是
# 「已加载扩展 id 集合 == 声明集合」。基座**不给自己开后门** ——
# 否则基座扩展就成了唯一一个"加载失败也没人知道"的东西。
#
# 渲染器会把本清单与智能体自己的 harness/<h>/enhancements.yaml **合并**后写进产物，
# 于是 doctor 的集合断言天然覆盖「基座不变量 ∪ 智能体声明」。
# ============================================================================
harness: pi
enhancements:
  - kind: hook
    id: trace
    entry: extensions/trace.ts
    description: >
      基座不变量：订阅 loop 回调，把实际发生的事映射成统一轨迹事件。
      只订阅、不返回值、绝不抛异常（业务扩展也会叠加同一批回调）。
