apiVersion: agent-base/v1

# ============================================================================
# 基座不变量增强的声明清单（§4.5）
#
# 为什么基座自己的扩展也要声明：闸门 2 的第三条硬断言是
# 「已加载扩展 id 集合 == 声明集合」。基座**不给自己开后门** ——
# 否则基座扩展就成了唯一一个"加载失败也没人知道"的东西。
#
# 渲染器会把本清单与智能体自己的 harness/<h>/enhancements.yaml **合并**后写进产物，
# 于是 doctor 的集合断言天然覆盖「基座不变量 ∪ 智能体声明」。
# ============================================================================
harness: pi
enhancements:
  - kind: hook
    id: trace
    entry: extensions/trace.ts
    # 订阅哪 6 个事件：与 extensions/trace.ts 的 `pi.on(...)` 逐条对应（闸门 1 会拿
    # adapters/pi/adapter.yaml 的 hookEvents.events 对名字 —— 基座不给自己开后门）。
    events:
      - session_start
      - before_provider_request
      - after_provider_response
      - tool_call
      - tool_result
      - session_shutdown
    description: >
      基座不变量：订阅 loop 回调，把实际发生的事映射成统一轨迹事件。
      只订阅、不返回值、绝不抛异常（业务扩展也会叠加同一批回调）。

  # ---------------------------------------------------------------------------
  # 会话内项目自省：`/project`（路线图 §26 V1）
  # 让"这个项目现在声明了什么"在交互会话里随时可查，而不是每次去翻文档。
  # ---------------------------------------------------------------------------
  - kind: command
    id: project-info
    entry: extensions/project-info.ts
    description: >
      基座不变量：注册 `/project` 斜杠命令，把产物里的事实（技能/连接器/增强/钩子事件/
      模型/轨迹/可移植性）摊开给人看，并让补全列表本身就是"项目应该有哪些信息"的目录。
      纯逻辑在 `_project-info.mjs`（下划线开头 = 助手文件，不会被登记为扩展）。
