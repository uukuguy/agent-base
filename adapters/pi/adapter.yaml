harness: pi
version: "0.87.1"          # 精确 pin（本机实测版本）
adapterVersion: "0.1.0"
bin: pi                        # 可执行名（镜像内直接调用；harness 专有事实归本文件）
package: "@earendil-works/pi-coding-agent"   # npm 安装坐标（镜像构建用；harness 专有事实归本文件）

renders:
  output: agent-dir        # 渲染产物形态
  deterministic: true      # 同输入同输出（conformance/C2 会验证）

# ============================================================================
# 能力声明（统一设计 §5.2）
# 每项取值：supported | partial | unsupported | extension
#   · partial      —— 能用但有限制，限制必须写进 note，且必须进 failures.md 的检测清单
#   · extension    —— 靠扩展实现（基座自带或以业务级增强补）
#   · absent       —— 该 harness 原生没有这个能力，属"要接就得补"的事实，不是缺陷
#
# 每条 note 都标注依据：【实测】= 本机跑出来的；【文档】= 上游 docs；【待实测】= 尚未证实
# ============================================================================
capabilities:
  nativeParamInterpolation: unsupported
  nativeParamInterpolationNote: >
    models.json 只对 apiKey 与 headers 做环境插值，baseUrl 不做【实测 + 文档 models.md】。
    处置：渲染器产出 models.json.tmpl，entrypoint 在启动期用参数层渲染 —— 这正是「行为烤、参数下放」的实现。

  runtimeWritableConfig: supported
  runtimeWritableConfigNote: >
    连 --list-models 都会写 <agent-dir>/{models-store.json,auth.json}【实测】。
    处置：只读种子 + 启动期暂存为可写副本。

  implicitSkillSources: partial
  implicitSkillSourcesNote: >
    两个隐式源，配置键都关不掉【实测】：
      ① $HOME/.agents/skills
      ② <cwd 祖先>/.agents/skills（沿工作目录向上发现，止于仓库根）—— **第二源常被忽略**
    处置：文件系统隔离（固定 HOME + 中立化 cwd）+ `--no-skills --skill <声明目录>` 双保险。

  configInclude: unsupported
  configIncludeNote: >
    settings.json 无 include/extends，不能多文件拼接。处置：构建期扁平化，渲染器产出完整最终值。

  hmr: unsupported
  hmrNote: 改配置需重启。处置：本地迭代用交互模式，见 §9.1。

  childAgents: partial
  childAgentsNote: subagent 扩展已加载，未跑真实委派（N20 的解除条件）。

  osSandbox: unsupported
  osSandboxNote: 无 OS 级沙箱（Linux 下也没有等价物）。处置：容器层承担硬下限（§7.2）。

  permissionModel: extension
  permissionModelNote: 靠 protected-paths 扩展。

  traceEmit: supported
  traceEmitNote: >
    **原生支持，不需要自建审计扩展**（实测修正：原文曾标为 extension；也不要自创 "native" 这种取值——它就是 supported）。
    两条原生轨迹通道：
      ① `--mode json` 的结构化 JSONL 事件流（stdout 专供 JSONL，诊断走 stderr，与 §8.2 天然一致）；
         RPC 模式复用同一套事件形状。
      ② 版本化会话文件 `~/.pi/agent/sessions/--<path>--/<ts>_<id>.jsonl`（v3，id/parentId 树，可分支）。
    适配器职责是**映射**而非发明：见 trace-mapping.md。
    三处缺口必须显式处理：G1 事件流无 wire 级 tools 计数与 stream 标志（门 3 需链路观测）；
    G2 tool_execution_end 无耗时字段（ms 只能推算）；G3 tool.call.decision 无原生字段（暂记 allow）。

  mcpClient: extension
  mcpClientNote: >
    **原生没有，但已用扩展补上**（实测 + 已选型）。
    ① 原生事实：pi 的 docs/README/CHANGELOG 对 MCP 零提及，包内无 mcp.json / allowInstall /
       hostConfigDiscovery，bundle 里的 mcpServers 全是第三方 SDK 内部字段。
    ② 处置：按 §5.4「等效替代」，**不自研**，采用并精确 pin 一个第三方扩展
       （`pi-mcp-adapter@2.37.0`，见 docs/research/2026-09-25-mcp-ecosystem-survey.md）。
       它以**基座种子依赖**形式装进基座镜像（登记在 core/image/preinstall.yaml，构建期全局安装，
       运行期不需要网络）。
    ③ 渲染形态：`connectors.yaml` → **agent-dir 的 `mcp.json`**
       （`{mcpServers: {<名字>: {command,args,env}|{url,headers}}, settings: {allowInstall:false,
       hostConfigDiscovery:"off"}}`）+ `settings.json` 的 `packages` 声明该扩展的**本地路径**。
       这个形状与该扩展实现一致（实测读的是 agent-dir 下的 `mcp.json`）。
    ④ 实测证据：同一智能体，**不带连接器时端点收到 4 个工具，带 filesystem 连接器时收到 7 个**
       （该 MCP 服务器的 3 个工具真的注册进来了），退出码 0、无报错。
    ⑤ 纪律：产物声明了扩展包而本地运行未提供本地路径时，运行器**响亮失败** ——
       不许跑出一个"没有 MCP 客户端"的智能体而无人察觉。

  runModes: [interactive, oneshot, rpc, debug]

# 业务级增强的**声明形态**（决定用例助手怎么写声明、渲染器怎么读）：
#   file    = 扩展是产物里的文件，用 `entry:` 指向（如 extensions/x.ts）
#   package = 扩展是 npm 包（如 cordis 插件），用 `package:` 指向
enhancementShape: file

failures: failures.md
exemptions: exemptions.yaml

# ============================================================================
# 运行期契约（适配决策，全部来自实测；S3 的 run-local / entrypoint 照此实现）
# ============================================================================
runtime:
  configDir:
    env: PI_CODING_AGENT_DIR
    value: <render 产物>/agent-dir
    why: >
      直接把配置目录指向渲染产物，**不必伪造 $HOME/.pi/agent**【实测：get_state 读到了渲染的
      models.json/settings.json，报 provider=corp-gateway model=corp-think】。
  isolation:
    home: 固定到空目录（杀掉 $HOME/.agents/skills 隐式源）
    cwd: 中立目录（杀掉 cwd 祖先的 .agents/skills 隐式源）
    why: P-b —— 隔离靠文件系统，不靠配置
  skills:
    flags: ["--no-skills", "--skill", "<每个声明目录>"]
    why: >
      --no-skills 关掉发现，--skill 显式加载声明目录【实测：命令列表里只剩声明的 skill:example，
      隐式源的 skill:leaked 消失】。与文件系统隔离叠加使用（双保险）。
  offline:
    env: PI_OFFLINE
    value: "1"
    why: 启动期不做网络操作（模型目录刷新、版本检查），使闸门 1–2 真正零网络。
  session:
    flags: ["--no-session"]
    why: 验证场景不留会话文件，保证可重复。
  rpc:
    requestShape: '{"type":"get_commands"} / {"type":"get_state"}'
    why: >
      零凭据自证原语【实测】。注意：不是 JSON-RPC 的 method 字段，用错会得到
      {"success":false,"error":"Unknown command: undefined"}。
