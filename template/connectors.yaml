apiVersion: agent-base/v1

# 连接器（可选）。不写 = 没有连接器。
#
# 两种写法，任选其一：
#
# ① 按名引用基座预装条目 —— 推荐，不需要知道包名/版本/参数：
#      - ref: filesystem
#        enabled: true
#
# ② 完整写法 —— 需要自研连接器或预装清单里没有的系统时用：
#      - name: jira
#        transport: streamable-http      # stdio | streamable-http
#        urlRef: AGENT_JIRA_ENDPOINT_PROD # 端点只写引用名，真值由部署期注入
#        credentialRef: JIRA_TOKEN        # 凭据同样只写引用名
#        enabled: true
#        description: 工单系统            # 会进系统提示词，写给模型看
#
# 可用名字见基座仓库的 core/image/preinstall.yaml（namedReferences）。
# ---------------------------------------------------------------------------
# 默认启用「开发常用子集」（路线图 §27 D9 / L4 C3）
#
# **只用 `ref:`**：不写包名、不写版本 —— 那些是基座能力目录的事（换 pin 只改基座一处）。
# 这三条都在基座预装清单里、离线可跑（镜像构建期装齐；本地 `make dev-env` 装到 .local-packages）。
#
# 它们属于 `coding` 能力包：**默认组合带 coding**（见 Makefile 的 BUNDLES），
# 所以新派生的智能体开箱就能读改代码、查 git、打包仓库上下文。
# 想要"纯验证"环境（结论更可复现、失败原因不被无关能力淹没）：
#     make verify BUNDLES=verify-baseline
# ---------------------------------------------------------------------------
mcpServers:
  - ref: filesystem
    enabled: true
    description: 沙箱内读写文件（把工作区限定在声明过的目录里）
  - ref: git
    enabled: true
    description: 查仓库状态/历史/差异 —— 改代码前先看清现状
  - ref: repomix
    enabled: true
    description: 把一个仓库打包成一份上下文（上手陌生代码库时省事）
