name: production-acceptance

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified multi-architecture image to GHCR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static and policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static and policy checks
        run: |
          make validate validate-selftest hygiene-selftest child-env-selftest sanitize-selftest manifest-integrity-selftest
          node core/gates/output-path-selftest.mjs
          node core/gates/report-selftest.mjs

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"

  production:
    name: Docker production acceptance
    runs-on: ubuntu-latest
    needs: static
    # Keep a hung Docker/QEMU build from occupying a runner for 90 minutes.
    # Each expensive step has its own deadline below, so failures identify the
    # phase that stalled instead of looking like an undifferentiated timeout.
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the pinned host runtimes and connectors
        run: |
          make dev-env
          make local-packages
          make local-packages-lock
          make local-packages-check

      # make regression builds and runs both linux/amd64 and linux/arm64.
      # QEMU is needed for the non-native architecture on the hosted x86 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Confirm Docker and loopback prerequisites
        run: |
          docker version
          docker info
          node --input-type=module - <<'NODE'
          import net from "node:net";
          const server = net.createServer();
          server.listen(0, "127.0.0.1", () => {
            console.log(`loopback=${server.address().address}:${server.address().port}`);
            server.close();
          });
          server.on("error", (error) => {
            console.error(`loopback unavailable: ${error.message}`);
            process.exitCode = 1;
          });
          NODE

      - name: Build both production and debug image variants
        run: timeout --signal=TERM --kill-after=30s 15m node core/image/build.mjs --all --debug

      - name: Run complete production regression
        run: |
          mkdir -p ci-artifacts
          timeout --signal=TERM --kill-after=30s 15m node tools/regression.mjs --json > ci-artifacts/regression.json
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import { imageInputsDigest } from "./core/image/inputs-digest.mjs";
          const report = JSON.parse(fs.readFileSync("ci-artifacts/regression.json", "utf8"));
          if (report.ok !== true || !Array.isArray(report.failed) || report.failed.length ||
              !Array.isArray(report.skipped) || report.skipped.length) {
            throw new Error("Publishing requires a complete regression with no failures or skipped checks");
          }
          const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
          fs.writeFileSync("ci-artifacts/release.json", JSON.stringify({
            version, revision: process.env.GITHUB_SHA, inputsDigest: imageInputsDigest()
          }, null, 2));
          NODE

      - name: Build the multi-architecture OCI manifest
        run: timeout --signal=TERM --kill-after=30s 15m node core/image/build.mjs --manifest

      - name: Save the verified release image
        if: success() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'))
        run: |
          rm -rf release-artifact
          mkdir -p release-artifact
          cp ci-artifacts/release.json release-artifact/
          cp dist/image/agent-base-*.oci.tar release-artifact/

      - name: Upload the verified release image
        if: success() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'))
        uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ github.sha }}
          path: release-artifact/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload structured acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish the verified image to GHCR
    needs: production
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the verified release image
        uses: actions/download-artifact@v4
        with:
          name: release-image-${{ github.sha }}

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish and verify both architectures
        run: |
          version=$(jq -r .version release.json)
          test "$(jq -r .revision release.json)" = "$GITHUB_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          timeout --signal=TERM --kill-after=30s 8m skopeo copy --all \
            "oci-archive:agent-base-$version.oci.tar" "docker://$image:$version"
          skopeo inspect --raw "docker://$image:$version" > published-index.json
          jq -e '([.manifests[].platform | .os + "/" + .architecture]) as $platforms | ($platforms | index("linux/arm64")) != null and ($platforms | index("linux/amd64")) != null' published-index.json
          skopeo copy --all "docker://$image:$version" "docker://$image:latest"
          printf 'Published `%s:%s` and `%s:latest` from `%s`.\n' "$image" "$version" "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove registry credentials
        if: always()
        run: skopeo logout ghcr.io
