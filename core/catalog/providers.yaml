apiVersion: agent-base/v1

# ============================================================================
# 内置 provider 目录（基座自带，**开箱就用**）
#
# 智能体只写 `model.provider: <id>` + `model.name: <模型名>`，**一个配置文件都不用建**：
# 端点、密钥的通行名字、模型名单都来自这里。密钥放环境或变量文件（`.env`）即可。
#
# ## 字段
#
#   id            通行名字（`model.provider` 写的就是它）
#   api           协议形状（合法取值见各适配器 modelApis；闸门 1 按作用域校验）
#   baseUrl       端点（已核实；不写 = 交给运行时自己的供应商表解析）
#   baseUrlParam  可选：不写死端点，改用这个引用名（内部网关那种每环境不同的用它）
#   models        该供应商提供的模型名（**校验依据**，写错会当场列出来；留空则跳过成员资格校验）
#   credentialEnv 凭据的引用名；不写则按 `<ID 大写>_API_KEY` 约定
#   auth          `env`（默认）· `none`（本地模型服务，**不产生凭据参数**）
#                 · `native`（**基座不注入密钥**，交给运行时自己的凭据库，如订阅登录）
#   harnesses     作用域：这家在哪些运行时可用。缺省 = 都能用；写 [pi] = 只有它能用。
#                 各运行时原生认识的家数不同，**允许不同**，不要求处处一致。
#
# ## 覆盖方式（都不改基座代码）
#
#   · 部署层：`AGENT_PROVIDERS_FILE=/path/providers.yaml` 或 `AGENT_CATALOG_DIR=/dir`
#   · 智能体自带：把 `providers.yaml` 放在 agent.yaml 旁边（自动生效）
#   · 同名 id **按字段合并**（只写要改的字段即可），新 id 追加
#
# ## 模型名会随供应商更新
#
# 每条都标了核实来源。要确认你自己的账号/端点实际提供哪些，用
# `make providers-init ENDPOINT=… [API_KEY=…] PROVIDER=…` 问一次端点 —— 本地服务也能问。
# ============================================================================

providers:
  # ── 内置默认端点：本仓库自带的零凭据假网关（门 3/4 用它，不需要任何密钥）──────────
  - id: corp-gateway
    displayName: 内网网关（自带假网关是它的零凭据等价物）
    api: openai-completions
    baseUrlParam: CORP_GATEWAY_BASE_URL
    credentialEnv: CORP_GATEWAY_API_KEY
    models: [corp-think]

  # ══════════════════════════════════════════════════════════════════════════
  # 本地模型服务（开发验证期最常用；都走 OpenAI 兼容，**都不需要密钥**）
  # 容器里访问宿主机：Docker Desktop / OrbStack 用 host.docker.internal，Linux 可用 --network host
  # ══════════════════════════════════════════════════════════════════════════

  # Ollama：默认 http://localhost:11434，OpenAI 兼容面在 /v1
  - id: ollama
    displayName: Ollama（本机）
    api: openai-completions
    baseUrl: http://localhost:11434/v1
    auth: none
    # 本机拉了哪些模型只有你知道 → 留空跳过校验；用 providers-init 问出来即可
    models: []
    note: 用 `make providers-init ENDPOINT=http://localhost:11434/v1 PROVIDER=ollama` 列出本机模型。

  # vLLM：默认 http://localhost:8000/v1（`vllm serve`；加了 --api-key 时才需要凭据）
  - id: vllm
    displayName: vLLM（本机）
    api: openai-completions
    baseUrl: http://localhost:8000/v1
    auth: none
    models: []
    note: 模型名就是 `vllm serve <模型>` 时用的那个；用 providers-init 问出来。

  # 通用本地/自建 OpenAI 兼容服务：LM Studio(1234)、llama.cpp(8080)、其它
  # 端点由部署给（每台机器不一样），也不需要密钥。
  - id: local
    displayName: 本地/自建 OpenAI 兼容服务（端点由部署给）
    api: openai-completions
    baseUrlParam: LOCAL_BASE_URL
    auth: none
    models: []
    note: 设 `LOCAL_BASE_URL=http://localhost:1234/v1`（LM Studio）之类即可。

  # ══════════════════════════════════════════════════════════════════════════
  # 云供应商（密钥放环境或 .env；密钥名就是各家的通行写法）
  # ══════════════════════════════════════════════════════════════════════════

  # DeepSeek 开放平台（官方：api-docs.deepseek.com/quick_start/pricing）
  - id: deepseek
    displayName: DeepSeek
    api: openai-completions
    baseUrl: https://api.deepseek.com
    models: [deepseek-flash, deepseek-v4-pro]

  # OpenAI 官方（模型名取自本机 pi 的供应商表 openai → gpt-5.5；4o 系列为长尾）
  - id: openai
    displayName: OpenAI
    api: openai-completions
    baseUrl: https://api.openai.com/v1
    models: [gpt-5.5, gpt-5.4, gpt-4o, gpt-4o-mini]

  # OpenAI 订阅（Codex）：**免密钥** —— 环境里登录一次即用，密钥不出现在产物里。
  # 作用域只有 pi；基座不注入任何凭据，端点也交给它自己的供应商表解析。
  - id: openai-codex
    displayName: OpenAI Codex 订阅（登录一次即用，无需 API Key）
    api: openai-responses
    auth: native
    harnesses: [pi]
    models: [gpt-5.5]
    note: 先在运行环境里用 pi 登录订阅一次（凭据落在 pi 的 agent 目录 auth.json），之后不需要任何密钥。

  # Anthropic（原生 Messages 协议；官方明确说 OpenAI 兼容层不建议生产）
  # pi 官方文档里的端点示例即 https://api.anthropic.com
  - id: anthropic
    displayName: Anthropic（Claude）
    api: anthropic-messages
    baseUrl: https://api.anthropic.com
    models: [claude-opus-5-5, claude-sonnet-5, claude-haiku-4-5-20251001]

  # MiniMax（国际 .io / 国内 .cn）官方：platform.minimax.io/docs/api-reference/text-openai-api
  - id: minimax
    displayName: MiniMax（国际 api.minimax.io）
    api: openai-completions
    baseUrl: https://api.minimax.io/v1
    credentialEnv: MINIMAX_API_KEY
    models: [MiniMax-M3, MiniMax-M2.7, MiniMax-M2.7-highspeed, MiniMax-M2.5, MiniMax-M2]

  - id: minimax-cn
    displayName: MiniMax（国内 api.minimax.cn）
    api: openai-completions
    baseUrl: https://api.minimax.cn/v1
    credentialEnv: MINIMAX_CN_API_KEY
    models: [MiniMax-M3, MiniMax-M2.7, MiniMax-M2.7-highspeed, MiniMax-M2.5, MiniMax-M2]

  # GLM（智谱）：国际 api.z.ai / 国内 open.bigmodel.cn，密钥都叫 ZAI_API_KEY
  # 官方：docs.z.ai/guides/develop/openai/python · docs.bigmodel.cn/cn/guide/develop/openai/introduction
  - id: glm
    displayName: GLM（国际 api.z.ai）
    api: openai-completions
    baseUrl: https://api.z.ai/api/paas/v4
    credentialEnv: ZAI_API_KEY
    models: [glm-5.3, glm-5.3-flash, glm-5.2]

  - id: glm-cn
    displayName: GLM（国内 open.bigmodel.cn）
    api: openai-completions
    baseUrl: https://open.bigmodel.cn/api/paas/v4
    credentialEnv: ZAI_API_KEY
    models: [glm-5.3, glm-5.3-flash, glm-5.2]

  # Kimi（Moonshot）：国际 api.moonshot.ai / 国内 api.moonshot.cn，密钥 MOONSHOT_API_KEY
  # 官方：platform.kimi.ai/docs/api/overview · moonshot-v1 与 kimi-k2 系列已停用，这里只列在用的
  - id: kimi
    displayName: Kimi（国际 api.moonshot.ai）
    api: openai-completions
    baseUrl: https://api.moonshot.ai/v1
    credentialEnv: MOONSHOT_API_KEY
    models: [kimi-k3, kimi-k2.7-code, kimi-k2.7-code-highspeed, kimi-k2.6]

  - id: kimi-cn
    displayName: Kimi（国内 api.moonshot.cn）
    api: openai-completions
    baseUrl: https://api.moonshot.cn/v1
    credentialEnv: MOONSHOT_API_KEY
    models: [kimi-k3, kimi-k2.7-code, kimi-k2.7-code-highspeed, kimi-k2.6]
