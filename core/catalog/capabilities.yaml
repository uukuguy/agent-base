apiVersion: agent-base/v1

# ============================================================================
# 能力目录（统一设计 §4.6，N26）—— 机器可读真源
#
# docs/03-capability-catalog.md 由本文件生成（S6），保证文档与实现不漂移。
#
# 本文件是「行为烤、参数下放」(J2) 的第二个执法点：它记录每个字段的**所属层**。
#   目录说某字段属参数层、而它却出现在 agent.yaml 里 → validate 直接报错（§4.6）。
#
# 字段语义：
#   layer: artifact   —— 该字段的取值必须写在中性定义里（行为层）
#   layer: parameter  —— 该字段只能在部署期注入，不得出现在中性定义里（v1 无此类字段，
#                        参数层清单见 catalog/params.yaml）
#   valueRef: parameter —— 该字段在中性定义里**只写引用名**，取值来自参数层。
#                        必须与 params.yaml 里 backs 指向本 path 的条目**双向一致**（validate 校验）。
#   harnesses.<h>.support: supported | partial | unsupported | unknown
#   harnesses.<h>.verified: 该结论是否有实测依据（false = 待实测，§5.1 要求显式标注）
#
# 刻意保持小：中性格式只表达两个 harness 的可移植核心（交集）。表达力由 §4.5 的
# 业务级增强承接。
#
# **支持声明口径**（§25 O2）：基座**保证**本目录声明的字段；本目录之外同样允许
# （`x-` 前缀 / `customizations:` / `kind: x-*`，见 customizations 条目），但**不在保证范围内** ——
# 它们会被原样透传并在报告里标为「未验证声明」。拼错的已知字段仍硬错误。
# ============================================================================

description: 中性定义的完整字段目录，含类型、默认值、取值范围、所属层、各 harness 支持度与降级行为。

layerSemantics:
  artifact: 取值写在中性定义里；运行期不可覆盖（改了要重建智能体镜像薄层，§2.2 副作用三）。
  parameter: 只在部署期注入；出现在中性定义里即纪律违规。
  valueRefParameter: 定义里只写引用名，取值来自 catalog/params.yaml 的允许清单。

groups:
  # --------------------------------------------------------------------------
  - id: structural
    label: 结构字段（非业务概念）
    businessConcept: false
    fields:
      - path: apiVersion
        source: agent.yaml / connectors.yaml / harness/<h>/enhancements.yaml
        type: string
        required: true
        values: { const: agent-base/v1 }
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true, note: "渲染器只接受自己支持的版本，不支持则显式失败（§4.7）" }
          dsh: { support: supported, verified: true, note: 同上 }
        doc: 定义格式版本。破坏性变更时升 v2，基座同时支持 v1/v2 渲染并给出迁移提示。

      - path: customizations
        source: agent.yaml / connectors.yaml; 以及 harness/<h>/enhancements.yaml 的条目
        type: object
        required: false
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true, note: "原样透传进产物与清单，报告里列为未验证声明（§25 O1/O3）" }
          dsh: { support: supported, verified: true, note: 同上 }
        doc: >
          **开放命名空间**：基座不解释、原样透传的自定义容器。配套规则同一条：
          `x-` 前缀的键（任意层级）与 `kind: x-*` 自定义增强种类同样被允许；
          它们在闸门 1 报告与渲染清单里被列为**未验证声明**（不在基座保证范围内）。
          拼错的**已知**字段仍会硬错误（`additionalProperties: false` 不动）——
          这正是"允许扩展"与"拼错要响"之间的分界。

      - path: name
        source: agent.yaml
        type: string
        required: true
        values: { pattern: "^[a-z][a-z0-9-]{1,30}$" }
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true, note: "决定基座/智能体镜像名" }
          dsh: { support: supported, verified: true, note: "决定 profile 名与镜像名" }
        doc: 智能体名。同时约束镜像名与 dsh profile 名。

      - path: description
        source: agent.yaml
        type: string
        required: true
        values: { minLength: 1, maxLength: 200 }
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true }
          dsh: { support: supported, verified: true }
        doc: 一句话说明。进能力目录与系统提示词。

      - path: connectorsFile
        source: agent.yaml
        type: relativePath
        required: false
        default: connectors.yaml
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true, note: 渲染器解析并读入 }
          dsh: { support: supported, verified: true, note: 渲染器解析并读入 }
        doc: 连接器定义文件路径。默认同目录 connectors.yaml。

      - path: skillsDir
        source: agent.yaml
        type: relativePath
        required: false
        default: skills
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true, note: "→ agent-dir/skills/（§10.2）" }
          dsh: { support: supported, verified: true, note: "→ profile 的 customSkillDirs，rank 300（§11.2）" }
        doc: 技能目录。中性定义只声明本目录下的技能；隐式加载源必须由适配器用文件系统隔离（§4.4）。

  # --------------------------------------------------------------------------
  - id: identity
    label: 「它是谁、边界在哪」
    businessConcept: true
    fields:
      - path: persona.instructions
        source: agent.yaml
        type: string
        required: "oneOf(instructions, instructionsFile)"
        values: { minLength: 1 }
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true, note: "→ agent-dir/AGENTS.md 常驻指令（§10.2）" }
          dsh: { support: supported, verified: true, note: "→ profile 内的 agent 提示词 row（§11.2）" }
        doc: 常驻人设文本。与 persona.instructionsFile 互斥，validate 拒绝同时出现。

      - path: persona.instructionsFile
        source: agent.yaml
        type: relativePath
        required: "oneOf(instructions, instructionsFile)"
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true, note: 渲染器读取文件内容后写入 AGENTS.md }
          dsh: { support: supported, verified: true, note: 渲染器读取文件内容后写入 profile 提示词 row }
        doc: 长文本人设的文件路径（推荐用于长文本）。绝对路径被 schema 拒绝（§9.2）。

      - path: tools.deny
        source: agent.yaml
        type: string[]
        required: false
        default: []
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true, note: "→ settings.json 的工具配置（§10.2）" }
          dsh: { support: supported, verified: true, note: "→ profile 内工具 row 的 disabled / config（§11.2）" }
        doc: 工具黑名单（边界）。v1 不表达白名单——两份上位文档的实测只覆盖 deny。
        reserved:
          - path: tools.allow
            reason: 若未来纳入中性定义，它同属制品层，必须同时进本目录与 params.yaml 的禁止清单。

  # --------------------------------------------------------------------------
  - id: model
    label: 「它用哪个模型」
    businessConcept: true
    fields:
      - path: model.provider
        source: agent.yaml
        type: string
        required: true
        layer: artifact
        valueRef: parameter
        harnesses:
          pi: { support: supported, verified: true }
          dsh: { support: supported, verified: true }
        doc: >
          模型供应商名。基座**内置**了常用供应商（deepseek / openai / corp-gateway …），
          智能体只写名字；端点、凭据引用名、模型名单都来自那份内置目录，
          要改就用 `providers.yaml`（放智能体旁边或用 AGENT_PROVIDERS_FILE）覆盖同名条目。
        degradation: 供应商不在目录里 → 渲染期直接失败并列出可用名字。

      - path: model.name
        source: agent.yaml
        type: string
        required: true
        layer: valueRefParameter
        valueRef: parameter
        harnesses:
          pi: { support: supported, verified: true, note: "启动期渲染进 models.json 与 settings 默认模型" }
          dsh: { support: supported, verified: true, note: "profile 里以 !!js 取 process.env，原生插值" }
        doc: >
          **默认**模型名。属环境属性 —— 同一份制品在不同环境常要指向不同模型名（端点不同、模型目录不同）。
          运行期可用 `<供应商前缀>_MODEL` 覆盖；覆盖值须在该 provider 声明的模型名单内，并会记进轨迹。
          可配置 ≠ 随便配 ≠ 配了没人知道。
        degradation: 路由未声明模型名单时跳过成员资格校验（名字非空仍强制）；名单校验只覆盖"是否属于该路由"。

      - path: model.reasoningEffort
        source: agent.yaml
        type: enum
        required: false
        default: null
        values: { enum: [low, medium, high] }
        layer: artifact
        harnesses:
          pi: { support: unknown, verified: false, note: "§10 未记录该字段的映射——**待实测**" }
          dsh: { support: supported, verified: false, note: "dsh-agent-default-model 的 {provider, model, reasoningEffort?}（dsh 上位文档 §3）；**待实测**" }
        doc: 推理强度。harness 不支持时按 exemptions.yaml 处理（§5.4），三种合法处置：等效替代 / 豁免 / 拒绝；禁止静默降级。

  # --------------------------------------------------------------------------
  - id: skills
    label: 「它会哪些技能」
    businessConcept: true
    fields:
      - path: skills[].name
        source: skills/<name>/SKILL.md（frontmatter）
        type: string
        required: true
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true, note: "SKILL.md frontmatter；目录 bundle 形式（§4.4）" }
          dsh: { support: supported, verified: true, note: 同上；技能目录必须进 rank 300 }
        doc: 技能名。目录 bundle 形式对齐两个 harness 的交集。
        degradation: 出现未声明的技能 = 隐式加载源没隔离干净 → 闸门 2 集合断言变红（§6.3 硬断言 1）。

      - path: skills[].description
        source: skills/<name>/SKILL.md（frontmatter）
        type: string
        required: true
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true }
          dsh: { support: supported, verified: true }
        doc: 技能的一句话说明，供模型判断何时使用。

      - path: skills[].whenToUse
        source: skills/<name>/SKILL.md（frontmatter）
        type: string
        required: false
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true }
          dsh: { support: supported, verified: true }
        doc: 何时使用该技能（触发条件描述）。

  # --------------------------------------------------------------------------
  - id: loop
    label: 「它能跑多久、跑多少步」
    businessConcept: true
    fields:
      - path: loop.maxModelCalls
        source: agent.yaml
        type: integer
        required: false
        default: null
        layer: verification
        harnesses:
          pi: { support: extension, verified: true, note: "运行时 CLI/设置里**没有**轮次预算旋钮（实测）；基座从轨迹数 model.request 条数并断言（core/gates/loop.mjs），闸门 4 越界即红" }
          dsh: { support: extension, verified: false, note: "同一断言逻辑（运行时中立）；本侧可用的事件源与另一个运行时不同（端点侧轨迹），**待实测**" }
        doc: 一次运行最多几次模型调用（一次调用 = 一轮）。这是**可断言的声明**，不是运行时开关：基座跑完数轨迹，超了判红并给出数字。
        degradation: 声明的上限与实际不符 ⇒ 闸门 4 红并点名哪个 run、实际几步、上限几步。

      - path: loop.maxToolCalls
        source: agent.yaml
        type: integer
        required: false
        default: null
        layer: verification
        harnesses:
          pi: { support: extension, verified: true, note: 同上（数 tool_call 条数） }
          dsh: { support: extension, verified: false, note: 同上 }
        doc: 一次运行最多几次工具调用。防「工具风暴」把一次运行跑成几百步。

      - path: loop.maxWallClockSeconds
        source: agent.yaml
        type: integer
        required: false
        default: null
        layer: verification
        harnesses:
          pi: { support: extension, verified: true, note: "**这一条会被真正执行**：基座把它作为运行超时传给运行器，跑超就掐掉（次数类只能事后断言）" }
          dsh: { support: extension, verified: false, note: 同上；待实测 }
        doc: 一次运行的挂钟上限（秒）。与其他两条不同：这条**强制执行**（超时即中止并按失败处理）。
        note: >
          **终止条件**不由基座声明：循环何时结束由模型（不再调用工具）与运行时决定。基座能做的是**如实记下它是怎么结束的** ——
          轨迹新增 `run.end`（第 12 类事件，reason 用运行时原话；实测 shutdown 载荷带 {type, reason}），于是「正常跑完」与「中途被掐断」
          在证据上分得开。**委派深度**目前不可断言：本环境实测**没有委派工具**（`pi list` 只有两个无关扩展），且轨迹没有父子关联字段。

  # --------------------------------------------------------------------------
  - id: hooks
    label: 「钩子失败时怎么办」
    businessConcept: true
    fields:
      - path: hooks.onFailure
        source: agent.yaml
        type: enum
        required: false
        default: record
        values: { enum: [record, block] }
        layer: verification
        harnesses:
          pi: { support: extension, verified: true, note: "基座提供 guardedHook()（产物内的 _trace-emit.mjs）；**实测运行时自己会静默吞掉钩子异常**（退出 0、轨迹无痕），所以要显式包装才谈得上语义" }
          dsh: { support: extension, verified: true, note: "同一份 guardedHook 与同一类轨迹事件（core 单一真源）；两侧自检各跑一次正负例" }
        doc: record（默认）= 业务钩子抛异常时记录 hook.error 后继续；block = 记录后抛出、让本次运行失败。两条路都先留痕 —— 静默失败是不允许的。
        degradation: 声明了 hooks.onFailure 却没用 guardedHook 包装的业务钩子 ⇒ 闸门 1 判红（否则这条声明给不出任何保证）。

  # --------------------------------------------------------------------------
  - id: connectors
    label: 「它能连哪些系统」
    businessConcept: true
    fields:
      - path: mcpServers[].ref
        source: connectors.yaml
        type: string
        required: "ref 形态必填（与完整形态互斥）"
        values: { pattern: "^[a-z][a-z0-9-]{1,30}$" }
        layer: artifact
        harnesses:
          pi: { support: partial, verified: false, note: "解析由基座 render 完成；pi 侧的 MCP 客户端本身不自带（S2 预检结论），需基座提供客户端能力" }
          dsh: { support: supported, verified: true, note: "解析后落为 dsh-mcp-client row（§11.2）" }
        doc: >
          按名引用基座预装条目（§4.3 设计点 4）。解析来源 core/image/preinstall.yaml 的 namedReferences。
          这是「开发智能体便捷」的关键形态：开发者只写一个名字，不需要知道包名、版本、启动参数。
        degradation: 未知 ref 必须显式失败（不是警告）——否则开发者会以为连接器生效了。
        rules:
          - 不允许覆写 transport / command / args / urlRef / credentialRef（否则每个智能体又各自 pin 版本，「升级局部化」失效）
          - 需要定制时改用完整形态；两种形态在 schema 里互斥
          - 服务器名默认 = ref 名，可用 name 覆盖

      - path: mcpServers[].name
        source: connectors.yaml
        type: string
        required: true
        values: { pattern: "^[A-Za-z0-9_-]{1,32}$" }
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true, note: "→ mcp.json 的 server key（§10.2）" }
          dsh: { support: supported, verified: true, note: "→ 每服务器一条 dsh-mcp-client row（§11.2）" }
        doc: 连接器名。对齐 dsh serverName 的命名空间约束。

      - path: mcpServers[].transport
        source: connectors.yaml
        type: enum
        required: true
        values: { enum: [stdio, streamable-http] }
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true, note: "mcp.json 的 server 配置" }
          dsh: { support: supported, verified: true, note: "row 的 transport 字段" }
        doc: 传输方式。决定 urlRef / command 哪个是必填（schema 用 oneOf 分型强制）。

      - path: mcpServers[].urlRef
        source: connectors.yaml
        type: refName
        required: "transport=streamable-http 时必填"
        layer: artifact
        valueRef: parameter
        harnesses:
          pi: { support: partial, verified: true, note: "baseUrl 不做环境插值 → 启动期渲染 .tmpl（§10.2 约束 1）" }
          dsh: { support: supported, verified: true, note: "!!js process.env.X 原生支持（§11.2）" }
        doc: 端点引用名。取值来自 params.yaml 的 connector-endpoint。
        degradation: pi 只能启动时给，不能 per-request（§10.4 H2 缺口）。

      - path: mcpServers[].credentialRef
        source: connectors.yaml
        type: refName
        required: false
        layer: artifact
        valueRef: parameter
        harnesses:
          pi: { support: partial, verified: true, note: "启动期渲染；MCP 凭据治理未做（§10.3 缺口）" }
          dsh: { support: partial, verified: true, note: "文件权限无法对 agent 进程隔离 —— 边界由**运行环境**提供（容器 / 沙箱 / 机器权限），基座不假定是哪一种（§7.2 / §11.1）" }
        doc: 凭据引用名。取值来自 params.yaml 的 connector-credential。

      - path: mcpServers[].command
        source: connectors.yaml
        type: string
        required: "transport=stdio 时必填"
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true, note: "直出到 mcp.json" }
          dsh: { support: supported, verified: true, note: 进 row 配置 }
        doc: 可执行名或镜像内固定路径。属制品层——它决定「能连什么」，且是可执行内容。

      - path: mcpServers[].args
        source: connectors.yaml
        type: string[]
        required: false
        default: []
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true }
          dsh: { support: supported, verified: true }
        doc: stdio 参数列表。引用自研连接器时用相对路径（mcp-servers/<name>/…），渲染器解析成镜像内固定路径（§4.3 设计点 3）。

      - path: mcpServers[].enabled
        source: connectors.yaml
        type: boolean
        required: false
        default: true
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true }
          dsh: { support: supported, verified: true, note: "failOnStartupError 默认 false，连不上也启动（§11.1）" }
        doc: 是否启用该连接器。「有哪些连接器」改变行为 → 属制品层。
        degradation: 闸门 2 断言 enabled:true 的集合 == 声明集合；少一个即静默降级 → 变红（§6.3 硬断言 2）。

      - path: mcpServers[].description
        source: connectors.yaml
        type: string
        required: false
        values: { minLength: 1, maxLength: 200 }
        layer: artifact
        harnesses:
          pi: { support: supported, verified: true }
          dsh: { support: supported, verified: true }
        doc: 连接器说明。进能力目录与系统提示词。

  # --------------------------------------------------------------------------
  - id: enhancements
    label: 业务级 harness 增强（一等公民，harness 专有、不可移植）
    businessConcept: false
    portability: none
    design: "§4.5"
    note: >
      本组字段**不在可移植核心内**：pi 扩展与 dsh 插件是两套根本不同的机制，
      等价性只覆盖可移植核心（§1.4）。它是企业智能体的常态需求，不是逃生舱。
      validate 必须显式输出本智能体的可移植性等级（如「核心 + pi 增强（不可移植）」）。
    fields:
      - path: harness/<h>/enhancements.yaml#enhancements[].id
        source: harness/<h>/enhancements.yaml
        type: string
        required: true
        layer: artifact
        harnesses:
          pi: { support: partial, verified: false, note: "extensions/*.ts + settings.json 的 packages；业务自建扩展的 API 面与加载失败是否报错**待实测**（§10.4 H10）" }
          dsh: { support: partial, verified: false, note: "cordis 插件包 + profile 的 insert: row；row 落空是静默失败（§11.2 / §5.5）" }
        doc: 增强的唯一 id。声明即契约。
        degradation: 闸门 2 的**第三条硬断言**：已加载扩展 id 集合 == 声明集合。少一个即静默失败，多一个说明有未声明增强混入产物（§6.3）。

      - path: harness/<h>/enhancements.yaml#enhancements[].kind
        source: harness/<h>/enhancements.yaml
        type: enum
        required: true
        values: { enum: [tool, hook, command, middleware, subagent, provider, other] }
        layer: artifact
        harnesses:
          pi: { support: partial, verified: false, note: "事件钩子 / 自定义工具 / agents/ 子智能体 / prompts/ 命令 / packages" }
          dsh: { support: partial, verified: false, note: "cordis 插件；一切皆插件（按「这个增强是什么」选 kind，而不是按它的打包形态）" }
        doc: 增强类型。取值与 enhancements.schema.json 的枚举**必须一致**（闸门 1 的 catalog/enum-sync 盯着）。

      - path: harness/<h>/enhancements.yaml#enhancements[].entry
        source: harness/<h>/enhancements.yaml
        type: relativePath
        required: "oneOf(entry, package)"
        layer: artifact
        harnesses:
          pi: { support: partial, verified: false }
          dsh: { support: partial, verified: false }
        doc: 增强入口文件（相对路径，文件形态的运行时用）。随制品烤进智能体镜像薄层，参与 digest。

      - path: harness/<h>/enhancements.yaml#enhancements[].package
        source: harness/<h>/enhancements.yaml
        type: string
        required: "oneOf(entry, package)"
        layer: artifact
        harnesses:
          pi: { support: partial, verified: false, note: "扩展也可以是 npm 包，但登记路径仍走 entry" }
          dsh: { support: partial, verified: false, note: "cordis 插件包名，或以 . 开头的相对路径（基准是 profile 配置目录）" }
        doc: 插件包名或相对路径（包形态的运行时用）。与 entry 二选一。

      - path: harness/<h>/enhancements.yaml#enhancements[].events
        source: harness/<h>/enhancements.yaml
        type: string[]
        required: "kind=hook 时必填"
        layer: artifact
        harnesses:
          pi: { support: partial, verified: false, note: "39 个可订阅事件（adapters/pi/adapter.yaml 的 hookEvents.events 是权威清单，闸门 1 逐个对名字）" }
          dsh: { support: partial, verified: false, note: "无统一钩子总线；事件集合尚未穷举 ⇒ 声明按「未验证」处理（adapter.yaml 的 hookEvents.enumerated=false）" }
        doc: 钩子订阅哪些生命周期事件（**数组**，基座自己的轨迹扩展就订阅 6 个）。名字必须属于 adapters/<h>/adapter.yaml 声明的可订阅集合。
        degradation: 写错事件名 ⇒ 闸门 1 的 enhance/events 当场红。该运行时未穷举集合时**不做假校验**，而是把声明标成「未验证」。

      - path: harness/<h>/enhancements.yaml#enhancements[].config
        source: harness/<h>/enhancements.yaml
        type: object
        required: false
        layer: artifact
        harnesses:
          pi: { support: partial, verified: false }
          dsh: { support: partial, verified: false }
        doc: 传给该增强的配置（原样透传进产物；基座不解释业务键 —— 保证/允许/不管的"允许"段）。

      - path: harness/<h>/enhancements.yaml#enhancements[].description
        source: harness/<h>/enhancements.yaml
        type: string
        required: false
        layer: artifact
        harnesses:
          pi: { support: partial, verified: false }
          dsh: { support: partial, verified: false }
        doc: 这个增强是干什么的（给人看的；不进判据）。

# ============================================================================
# 三个 harness 无关的要求（不进 groups，但 validate 必须强制）
# ============================================================================
invariants:
  - id: no-harness-name-in-core
    requirement: core/ 内不得出现任何 harness 名字（每个实施阶段的通用闸门，附录 B）。
    enforcedBy: ["gates/1"]
  - id: no-absolute-path
    requirement: 中性定义里禁止绝对路径（§9.2 差异表）。
    enforcedBy: ["spec/*.schema.json（relativePath 的 pattern）"]
  - id: single-source-of-truth
    requirement: 业务级增强不得与中性定义重复表达同一字段（§4.5）——两个真源会被 derive 出不一致的行为。
    enforcedBy: ["gates/1"]
  - id: layer-consistency
    requirement: "params.yaml 禁止清单里的 definitionPaths 必须被本目录标为 layer=artifact；且 valueRef=parameter 的字段必须与 params.yaml 的 backs 双向一致。"
    enforcedBy: ["gates/1"]
