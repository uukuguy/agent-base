apiVersion: agent-base/v1

# ============================================================================
# 模型路由目录（基座层，§2.6 P-a「能力在基座、选择在智能体」）
#
# ## 它为什么必须存在
#
# 中性定义里 `model.route` 写的是**基座声明的路由名**，不是 URL、不是 provider（agent.schema.json）。
# 但此前"有哪些路由、各自什么协议形状"**没有任何地方声明** —— 两个渲染器各自硬编码、
# 参数引用名靠约定推算。于是：
#   · 智能体写错路由名，渲染照样成功（等到运行时才炸，且报错看不懂）
#   · 换一个协议形状（例如 Anthropic Messages）就得改渲染器代码
#
# 这份目录把"路由能力"显式化。它是**基座不变量**，不是业务文件：
# 业务只选 route，改不了这里（要加路由得由平台按 §12.1 的分层来加）。
#
# ## 引用名约定（与 §2.3 一致，两个渲染器共用）
#
#   <路由名转大写、非字母数字换下划线>_BASE_URL   端点
#   <路由名转大写、非字母数字换下划线>_API_KEY    凭据
# 下面显式写出来而不是省略：显式才能被 `validate` 校验（拼错就是拼错），
# 隐式约定只能靠"两处都记得改"。
# ============================================================================

routes:
  - id: corp-gateway
    description: >
      企业内网直连的 OpenAI 兼容端点。验证期等价物是本仓库的零凭据假网关
      （tools/fake-gateway），它实现的正是同一套协议，所以门 3/4 不需要真端点。
    api: openai-completions          # 协议形状（pi 的 models.json.api 与 dsh 的 providers.<route>.api 同名）
    baseUrlParam: CORP_GATEWAY_BASE_URL
    credentialParam: CORP_GATEWAY_API_KEY
    models: []                       # 可选：已知模型目录；空表示由智能体的 model.name 直接指定
