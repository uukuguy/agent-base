apiVersion: agent-base/v1
mcpServers:
  - name: jira
    transport: streamable-http
    urlRef: AGENT_JIRA_ENDPOINT_PROD
    credentialRef: JIRA_TOKEN
    enabled: true
    description: 工单系统
  - name: gitlab
    transport: stdio
    command: npx
    args: ["-y", "@corp/gitlab-mcp@1.2.3"]
    credentialRef: GITLAB_TOKEN
    description: 代码托管
  # ref 形态：开发者只写一个名字，实现细节由 core/image/preinstall.yaml 解析
  - ref: filesystem
    enabled: true
    description: 工作区文件
  - ref: thinking
    name: reasoning
